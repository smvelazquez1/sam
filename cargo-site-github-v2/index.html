<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Book</title>
<link rel="icon" href="data:,">
<link rel="prefetch" href="home.html">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .db { position: relative; width: 220px; aspect-ratio: 632 / 787;
        filter: saturate(1.45);   /* richer colour */
        opacity: .8; }           /* a little see-through */
  .db img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .enter { margin-top: 1.4rem;
           font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
           font-size: 12px; font-weight: 400; letter-spacing: 0.02em;
           color: rgba(0, 0, 0, 0.85); text-decoration: none; padding: 0.4rem 0.6rem; }
  .enter:hover, .enter:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  .enter:active { opacity: 0.7; }
</style>
</head>
<body>
<div class="db" id="db" role="img" aria-label="Dream Book by Sam Gilliland, shown evolving through each stage of the painting"></div>
<a class="enter" href="home.html">enter here</a>
<script>
(() => {
  const FRAMES = ["images/dream/01.webp", "images/dream/02.webp", "images/dream/03.webp", "images/dream/04.webp", "images/dream/05.webp", "images/dream/06.webp", "images/dream/07.webp", "images/dream/08.webp", "images/dream/09.webp", "images/dream/10.webp", "images/dream/11.webp", "images/dream/12.webp", "images/dream/13.webp", "images/dream/14.webp", "images/dream/15.webp", "images/dream/16.webp", "images/dream/17.webp", "images/dream/18.webp", "images/dream/19.webp", "images/dream/20.webp", "images/dream/21.webp", "images/dream/22.webp", "images/dream/23.webp"];
  const HOLDS = [0.12, 0.1, 0.12, 0.1, 0.07, 0.13, 0.15, 0.18, 0.07, 0.07, 0.07, 0.07, 0.07, 0.07, 0.15, 0.12, 0.17, 0.17, 0.12, 0.12, 0.12, 0.08, 1.5];   // seconds per stage
  const FADE = 0.12;         // cross-fade, seconds
  const box = document.getElementById('db');
  const imgs = FRAMES.map(src => { const i = new Image(); i.alt = ''; box.appendChild(i); return i; });
  const N = imgs.length, starts = []; let total = 0;
  HOLDS.forEach(h => { starts.push(total); total += h + FADE; });
  const show = t => {
    let i = N - 1; while (i > 0 && t < starts[i]) i--;
    const f = Math.min(1, Math.max(0, (t - starts[i] - HOLDS[i]) / FADE));
    const j = (i + 1) % N;
    imgs.forEach((im, k) => im.style.opacity = k === i ? 1 : 0);
    if (f > 0) { imgs[j].style.opacity = f; if (j === 0) imgs[i].style.opacity = 1 - f; }
  };
  // start the loop once every picture has arrived, so no frame is ever missing mid-fade
  let left = N;
  const go = () => { const t0 = performance.now(); const tick = now => { show(((now - t0) / 1000) % total); requestAnimationFrame(tick); }; requestAnimationFrame(tick); };
  const done = () => { if (--left === 0) go(); };
  imgs.forEach((im, k) => { im.onload = im.onerror = done; im.src = FRAMES[k]; });
})();
</script>
</body>
</html>
